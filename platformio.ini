; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Ortak ayarlar — tüm env'ler miras alır. minros artık lib/minros altında
; git submodule olarak yaşıyor (bkz. .gitmodules); PlatformIO lib/ klasörünü
; otomatik taradığı için ayrıca lib_deps gerekmiyor. minrospy da aynı şekilde
; lib/minrospy altında submodule.
[env]

[env:esp32s3box]
platform = espressif32
board = esp32s3box
framework = arduino
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; ; Native test ortamı — donanım gerekmez, `pio test -e native` ile çalıştır
; [env:native]
; platform = native
; build_flags = -std=c++17
; ; Arduino bağımlı src/main.cpp derlenmesini engelle
; build_src_filter = -<*>
